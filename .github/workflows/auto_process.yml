name: 足彩数据自动分析

on:
  push:
    paths:
      - 'data/matches_*.json'
      - 'scripts/ai_analysis.py'
      - 'scripts/fetch_zqdc.py'
      - 'docs/**'
      - '.github/workflows/auto_process.yml'
      - 'requirements.txt'
      - 'runtime.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
          user_name: 'football-bot'
          user_email: 'bot@football-dashboard'
