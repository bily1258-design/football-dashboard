name: Build Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'data/raw/**'
  release:
    types: [published, edited]
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 11 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Download DB from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download db-latest \
            --repo bily1258-design/football-dashboard \
            --pattern 'football.db' \
            --dir data/ \
            --clobber \
            || echo "⚠️ No DB in Release"
          if [ -f data/football.db ]; then
            echo "✅ DB downloaded: $(du -h data/football.db | cut -f1)"
          else
            echo "⚠️ No DB available, pipeline may be limited"
          fi

      # ===== GA全流程：Termux只抓raw+push，以下全部在GA跑 =====

      - name: Determine date
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: STEP 1.4 - Generate predictions (OM → DB)
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -f data/football.db ]; then
            python scripts/predict_from_odds.py --date ${{ steps.date.outputs.date }} --db data/football.db || echo "⚠️ predict failed, continuing"
          else
            echo "⚠️ Skipping predict (no DB)"
          fi

      - name: STEP 1.2 - Pinnacle/HKJC odds → DB
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -f data/football.db ]; then
            python scripts/fetch_pinnacle_odds.py --date ${{ steps.date.outputs.date }} || echo "⚠️ pinnacle odds failed, continuing"
          else
            echo "⚠️ Skipping pinnacle (no DB)"
          fi

      - name: STEP 1.25 - Asian handicap → DB
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -f data/football.db ]; then
            python -c "
          import sys; sys.path.insert(0, 'scripts')
          from fetch_data import step_update_ah
          step_update_ah('${{ steps.date.outputs.date }}', 'data/football.db')
          " || echo "⚠️ AH update failed, continuing"
          else
            echo "⚠️ Skipping AH (no DB)"
          fi

      - name: STEP 1.3 - Fusion + EV + Kelly
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -f data/football.db ]; then
            python scripts/update_db_fusion.py --db data/football.db || echo "⚠️ fusion failed, continuing"
            python scripts/value_bet.py --all --db data/football.db || echo "⚠️ EV failed, continuing"
            python scripts/update_db_kelly.py --db data/football.db || echo "⚠️ kelly failed, continuing"
          else
            echo "⚠️ Skipping 3-chain (no DB)"
          fi

      - name: Backfill results from zgzcw
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -f data/football.db ]; then
            python -c "
          import sys; sys.path.insert(0, 'scripts')
          from fetch_data import step_backfill_results
          step_backfill_results('${{ steps.date.outputs.date }}', 'data/football.db')
          " || echo "⚠️ backfill failed, continuing"
          else
            echo "⚠️ Skipping backfill (no DB)"
          fi

      - name: Recalc final + Daily report
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -f data/football.db ]; then
            python scripts/recalc_final.py || echo "⚠️ recalc_final failed, continuing"
            python scripts/daily_report.py --date ${{ steps.date.outputs.date }} || echo "⚠️ daily_report failed, continuing"
          else
            echo "⚠️ Skipping report (no DB)"
          fi

      - name: Review
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -f data/football.db ]; then
            python scripts/review.py --date ${{ steps.date.outputs.date }} || echo "⚠️ review failed, continuing"
          else
            echo "⚠️ Skipping review (no DB)"
          fi

      - name: Align + Build
        run: |
          if [ -f data/football.db ]; then
            python scripts/align_and_merge.py --all --db data/football.db || echo "⚠️ align failed, continuing"
          else
            echo "⚠️ Skipping align (no DB)"
          fi

      - name: Push DB to Release
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f data/football.db ]; then
            gh release upload db-latest data/football.db --clobber || echo "⚠️ DB push failed, continuing"
          fi

      # ===== Pages 部署 =====

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Cleanup old Pages artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_IDS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/artifacts?name=github-pages" \
            --jq '.artifacts[] | .id' 2>/dev/null || true)
          for id in $ARTIFACT_IDS; do
            echo "Deleting old artifact $id"
            gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/artifacts/$id" 2>/dev/null || true
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit processed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/ data/reports/ data/raw/ 2>/dev/null || true
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "auto: build $(date +%Y-%m-%d)"
          git push origin main
