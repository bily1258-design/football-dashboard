name: Build Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'data/raw/**'
      - 'docs/**'
      - 'data/reports/**'
      - 'data/processed/**'
  release:
    types: [published, edited]
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 11 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Download DB from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download db-latest \
            --repo bily1258-design/football-dashboard \
            --pattern 'football.db' \
            --dir data/ \
            --clobber \
            || echo "⚠️ No DB in Release"
          if [ -f data/football.db ]; then
            echo "✅ DB downloaded: $(du -h data/football.db | cut -f1)"
          else
            echo "⚠️ No DB available, build may be limited"
          fi

      # ========== 数据抓取在Termux本地执行（WAF原因） ==========
      # GA只负责：下载Release DB → 日报/复盘/对齐 → 构建看板 → 部署

      - name: Recalculate final probabilities
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -f data/football.db ]; then
            python3 scripts/recalc_final.py || echo "⚠️ recalc_final failed, continuing"
          else
            echo "⚠️ Skipping recalc (no DB)"
          fi

      - name: Generate daily report
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -f data/football.db ]; then
            DATE=$(date +%Y-%m-%d)
            python3 scripts/daily_report.py --date "$DATE" --no-fundamental \
              || echo "⚠️ daily_report failed, continuing with existing data"
          else
            echo "⚠️ Skipping daily_report (no DB)"
          fi
        timeout-minutes: 20

      - name: Run LGBM fusion + EV recalc
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -f data/football.db ]; then
            python3 scripts/update_db_fusion.py || echo "⚠️ update_db_fusion failed, continuing"
            python3 scripts/value_bet.py || echo "⚠️ value_bet failed, continuing"
          else
            echo "⚠️ Skipping fusion/EV (no DB)"
          fi
        timeout-minutes: 10

      - name: Run review
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -f data/football.db ]; then
            DATE=$(date +%Y-%m-%d)
            python3 scripts/review.py --date "$DATE" || echo "⚠️ review failed, continuing"
          else
            echo "⚠️ Skipping review (no DB)"
          fi
        timeout-minutes: 10

      - name: Align and merge
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -f data/football.db ]; then
            python3 scripts/align_and_merge.py --all --db data/football.db
          else
            echo "⚠️ Skipping align (no DB)"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Cleanup old Pages artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_IDS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/artifacts?name=github-pages" \
            --jq '.artifacts[] | .id' 2>/dev/null || true)
          for id in $ARTIFACT_IDS; do
            echo "Deleting old artifact $id"
            gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/artifacts/$id" 2>/dev/null || true
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit processed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/ data/reports/ data/raw/ 2>/dev/null || true
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "auto: build $(date +%Y-%m-%d)"
          git push origin main

      # DB push已移除：GA不抓数据，只读Release DB来build。
      # 只由Termux本地push DB到Release。
