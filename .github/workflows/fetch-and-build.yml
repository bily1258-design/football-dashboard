name: Build Dashboard

on:
  # Termux push raw data 后自动触发
  push:
    branches: [main]
    paths:
      - 'data/raw/**'
      - 'data/reports/**'
      - 'data/processed/**'
  # DB Release 更新后自动触发
  release:
    types: [published, edited]
  # 手动触发（可指定参数）
  workflow_dispatch:
    inputs:
      run_daily_report:
        description: 'Run daily report before build'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      run_review:
        description: 'Run review after fetch'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      incremental:
        description: 'Incremental mode for daily report'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      date:
        description: 'Date for operations (YYYY-MM-DD, empty=today)'
        required: false
        default: ''
  # 定时：每天北京时间 13:00 (UTC 05:00) 和 19:00 (UTC 11:00)
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 11 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Download DB from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download db-latest \
            --repo bily1258-design/football-dashboard \
            --pattern 'football.db' \
            --dir data/ \
            || echo "⚠️ No DB in Release, will try fallback"
          if [ -f data/football.db ]; then
            echo "✅ DB downloaded: $(du -h data/football.db | cut -f1)"
          else
            echo "⚠️ No DB available, build may be limited"
          fi

      # 抓取赔率数据（schedule或manual触发时）
      - name: Fetch odds data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          DATE="${{ github.event.inputs.date || '' }}"
          if [ -z "$DATE" ]; then
            DATE=$(date +%Y-%m-%d)
          fi
          echo "📅 Fetching odds for $DATE"
          python scripts/odds_api.py --date "$DATE" || echo "⚠️ Odds fetch failed, continuing"

      # 生成日报（手动触发或定时）
      - name: Generate daily report
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_daily_report == 'true'
        run: |
          DATE="${{ github.event.inputs.date || '' }}"
          if [ -z "$DATE" ]; then
            DATE=$(date +%Y-%m-%d)
          fi
          echo "📊 Generating daily report for $DATE"
          INCR=""
          if [ "${{ github.event.inputs.incremental }}" == "true" ]; then
            INCR="--incremental"
          fi
          python scripts/daily_report.py --date "$DATE" $INCR || echo "⚠️ Daily report failed"

      # 执行复盘（手动触发）
      - name: Run review
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_review == 'true'
        run: |
          DATE="${{ github.event.inputs.date || '' }}"
          if [ -z "$DATE" ]; then
            DATE=$(date +%Y-%m-%d --date='yesterday')
          fi
          echo "🔍 Running review for $DATE"
          python scripts/review.py --date "$DATE" || echo "⚠️ Review failed"

      - name: Align and Merge
        run: |
          if [ -f data/football.db ]; then
            python scripts/align_and_merge.py --all --db data/football.db
          else
            echo "⚠️ Skipping align (no DB)"
          fi

      - name: Build Dashboard
        run: |
          if [ -f data/football.db ]; then
            python scripts/merge_and_build.py --db data/football.db --output .
          else
            # fallback: try from processed only
            python scripts/merge_and_build.py --output .
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-ghpages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages

      # 构建完成后提交processed数据
      - name: Commit processed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/ data/reports/ data/raw/ 2>/dev/null || true
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "auto: align+build $(date +%Y-%m-%d)"
          git push origin main

      # 上传DB到Release
      - name: Upload DB to Release
        if: github.event_name != 'pull_request'
        run: |
          if [ -f data/football.db ]; then
            echo "📦 Updating DB in Release..."
            python scripts/push_db.py --db data/football.db || echo "⚠️ DB upload failed"
          fi
