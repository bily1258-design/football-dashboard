name: Build Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'data/raw/**'
      - 'docs/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      date:
        description: Target date (YYYY-MM-DD), default today
        required: false
        type: string
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 11 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      - name: Download DB from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download db-latest \
            --repo bily1258-design/football-dashboard \
            --pattern 'football.db' \
            --dir data/ \
            --clobber || echo "No DB in Release"
          if [ -f data/football.db ]; then
            echo "DB downloaded: $(du -h data/football.db | cut -f1)"
          else
            echo "No DB available, pipeline may be limited"
          fi

      - name: Run pipeline
        run: |
          if [ -f data/football.db ]; then
            python scripts/pipeline.py --date ${{ steps.date.outputs.date }} --db data/football.db --skip-push --skip-fetch --skip-odds
          else
            echo "No DB, skipping pipeline"
          fi

      - name: Push DB to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f data/football.db ]; then
            gh release upload db-latest data/football.db --clobber || echo "DB push failed, continuing"
          fi

      # Deploy docs to gh-pages branch via gh CLI
      # WARNING: cd docs 失败时若没有 set -e + 目录检查，
      # 会误将整个仓库根目录推到 gh-pages → 看板 404
      - name: Deploy to Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -d docs ]; then echo "FATAL: docs/ missing, aborting deploy"; exit 1; fi
          cd docs
          git init -b main
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          echo "football.db" > .gitignore
          git add -A
          git commit -m "deploy: $(date +%Y-%m-%d)"
          git remote add origin "https://github.com/bily1258-design/football-dashboard.git"
          gh auth setup-git
          git push -f origin main:gh-pages
