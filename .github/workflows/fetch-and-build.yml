name: Build Dashboard

on:
  # Termux push raw data 后自动触发
  push:
    branches: [main]
    paths:
      - 'data/raw/**'
      - 'data/reports/**'
      - 'data/processed/**'
  # DB Release 更新后自动触发
  release:
    types: [published, edited]
  # 手动触发
  workflow_dispatch:
    inputs:
      date:
        description: 'Date (YYYY-MM-DD, empty=today)'
        required: false
        default: ''
  # 定时：每天北京时间 13:00 和 19:00
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 11 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Download DB from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download db-latest \
            --repo bily1258-design/football-dashboard \
            --pattern 'football.db' \
            --dir data/ \
            --clobber \
            || echo "⚠️ No DB in Release"
          if [ -f data/football.db ]; then
            echo "✅ DB downloaded: $(du -h data/football.db | cut -f1)"
          else
            echo "⚠️ No DB available, build may be limited"
          fi

      - name: Fetch odds data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          DATE="${{ github.event.inputs.date || '' }}"
          if [ -z "$DATE" ]; then
            DATE=$(date +%Y-%m-%d)
          fi
          echo "📅 Fetching odds for $DATE"
          python scripts/odds_api.py --date "$DATE" || echo "⚠️ Odds fetch failed"

      - name: Fetch Pinnacle & HKJC odds into DB
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          DATE="${{ github.event.inputs.date || '' }}"
          if [ -z "$DATE" ]; then
            DATE=$(date +%Y-%m-%d)
          fi
          if [ -f data/football.db ]; then
            echo "📅 Fetching Pinnacle/HKJC for $DATE"
            python scripts/fetch_pinnacle_odds.py --date "$DATE" || echo "⚠️ Pinnacle/HKJC fetch failed"
          else
            echo "⚠️ Skipping Pinnacle/HKJC (no DB)"
          fi

      - name: Update DB (fusion+EV+kelly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -f data/football.db ]; then
            echo "📊 Filling LGBM fusion probabilities"
            python scripts/update_db_fusion.py --db data/football.db || echo "⚠️ fusion fill failed"
            echo "📊 Recalculating EV with updated odds"
            python scripts/value_bet.py --all --db data/football.db || echo "⚠️ EV recalc failed"
            echo "📊 Recalculating Kelly with fusion/final"
            python scripts/update_db_kelly.py --db data/football.db || echo "⚠️ Kelly recalc failed"
          fi

      - name: Generate Predictions (OM → DB)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          DATE="${{ github.event.inputs.date || '' }}"
          if [ -z "$DATE" ]; then
            DATE=$(date +%Y-%m-%d)
          fi
          if [ -f data/football.db ]; then
            echo "🎯 Generating predictions for $DATE"
            python scripts/predict_from_odds.py --date "$DATE" --db data/football.db || echo "⚠️ Predict failed"
          else
            echo "⚠️ Skipping predict (no DB)"
          fi

      - name: Align and Merge
        run: |
          if [ -f data/football.db ]; then
            python scripts/align_and_merge.py --all --db data/football.db
          else
            echo "⚠️ Skipping align (no DB)"
          fi

      - name: Build Dashboard
        run: |
          if [ -f data/football.db ]; then
            python scripts/merge_and_build.py --db data/football.db --output .
          else
            python scripts/merge_and_build.py --output .
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Cleanup old Pages artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_IDS=$(gh api 
            -H "Accept: application/vnd.github+json" 
            "/repos/${{ github.repository }}/actions/artifacts?name=github-pages" 
            --jq '.artifacts[] | .id' 2>/dev/null || true)
          for id in $ARTIFACT_IDS; do
            echo "Deleting old artifact $id"
            gh api --method DELETE 
              -H "Accept: application/vnd.github+json" 
              "/repos/${{ github.repository }}/actions/artifacts/$id" 2>/dev/null || true
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit processed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/ data/reports/ data/raw/ 2>/dev/null || true
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "auto: align+build $(date +%Y-%m-%d)"
          git push origin main

      - name: Upload DB to Release
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f data/football.db ]; then
            echo "📦 Updating DB in Release..."
            python scripts/push_db.py --db data/football.db || echo "⚠️ DB upload failed"
          fi
