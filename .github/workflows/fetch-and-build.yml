name: Build Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'data/raw/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD), default today'
        required: false
        type: string
  schedule:
    - cron: '0 5 * * *'   # 13:00 Beijing
    - cron: '0 11 * * *'  # 19:00 Beijing

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      - name: Download DB from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download db-latest             --repo bily1258-design/football-dashboard             --pattern 'football.db'             --dir data/             --clobber             || echo "⚠️ No DB in Release"
          if [ -f data/football.db ]; then
            echo "✅ DB downloaded: $(du -h data/football.db | cut -f1)"
          else
            echo "⚠️ No DB available, pipeline may be limited"
          fi

      - name: Run pipeline
        run: |
          if [ -f data/football.db ]; then
            python scripts/pipeline.py --date ${{ steps.date.outputs.date }} --db data/football.db --skip-push --skip-fetch --skip-odds
          else
            echo "⚠️ No DB, skipping pipeline"
          fi

      - name: Push DB to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f data/football.db ]; then
            gh release upload db-latest data/football.db --clobber || echo "⚠️ DB push failed, continuing"
          fi

      # ===== Pages 部署 =====

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
          retention-days: 1

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 15
