<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>足彩价值投注看板</title>
<link rel="stylesheet" href="style.css?v=20260714v9">
</head>
<body>
<div class="container">
  <header>
    <h1>⚽ 足彩价值投注看板</h1>
    <div class="meta">
      <span id="updateTime">加载中...</span>
      <span id="matchCount">—</span>
      <span id="dateRange">—</span>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="beidan" onclick="switchTab('beidan')">北单</button>
      <button class="tab" data-tab="hkjc" onclick="switchTab('hkjc')">香港马会</button>
    </div>
    <div class="controls">
      <select id="dateFilter" onchange="applyFilters()">
        <option value="all">全部日期</option>
      </select>
      <select id="sortBy" onchange="applyFilters()">
        <option value="time">按时间</option>
        <option value="odds">按赔率</option>
      </select>
      <button id="refreshBtn" onclick="location.reload()">🔄 刷新</button>
    </div>
  </header>
  <div id="stats-bar"></div>
  <div id="loading">加载中...</div>

  <!-- 北单表 -->
  <div id="table-wrap-beidan" class="table-wrap" style="display:none">
    <table id="matchTable">
      <thead>
        <tr>
          <th data-sort="time">时间</th>
          <th data-sort="league">赛事</th>
          <th>主队</th>
          <th>比分</th>
          <th>客队</th>
          <th>方向</th>
          <th>命中</th>
          <th>赔率(初/即/分歧)</th>
          <th>模型(W/D/L)</th>
        </tr>
      </thead>
      <tbody id="matchBody"></tbody>
    </table>
  </div>

  <!-- 香港马会表 -->
  <div id="table-wrap-hkjc" class="table-wrap" style="display:none">
    <table id="hkjcTable">
      <thead>
        <tr>
          <th>时间</th>
          <th>赛事</th>
          <th>主队</th>
          <th>比分</th>
          <th>客队</th>
          <th>马会赔率(初/即/分歧)</th>
        </tr>
      </thead>
      <tbody id="hkjcBody"></tbody>
    </table>
  </div>
</div>
<script src="script.js?v=20260714v9"></script>
</body>
</html>
